<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>厨二語録現代語訳検定</title>
<style>
:root{--bg:#090b12;--panel:#111522;--panel2:#171c2b;--text:#eef2ff;--muted:#aab2c7;--line:#2a3247;--accent:#8db4ff;--accent2:#c6a7ff;--danger:#ff7f9f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#1a2034 0,#090b12 48%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;min-height:100vh}
.wrap{max-width:820px;margin:auto;padding:24px 16px 60px}.hero{text-align:center;padding:35px 10px 25px}.sigil{font-size:48px}.hero h1{font-size:clamp(27px,7vw,48px);letter-spacing:.08em;margin:8px 0}.hero p{color:var(--muted);margin:8px 0}.panel{background:rgba(17,21,34,.94);border:1px solid var(--line);border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 14px 45px #0006}
h2{margin-top:0}.grades{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grade{padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);color:var(--text);cursor:pointer;text-align:left}.grade:hover{border-color:var(--accent)}.grade b{font-size:21px}.grade span{display:block;color:var(--muted);margin-top:5px}
button{border:0;border-radius:11px;padding:12px 18px;background:var(--accent);color:#07101f;font-weight:700;cursor:pointer;font-size:15px}.secondary{background:#262e43;color:var(--text)}.danger{background:#492333;color:#ffdbe5}.row{display:flex;gap:9px;flex-wrap:wrap}.progress{height:8px;background:#252b3d;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}
.question{font-size:20px;line-height:2;white-space:pre-wrap;border-left:3px solid var(--accent);padding:4px 15px;margin:20px 0}.answerbox{width:100%;min-height:125px;background:#0b0e17;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px;font:inherit;resize:vertical}.result{padding:17px;border-radius:14px;background:#0c111e;border:1px solid var(--line);margin-top:15px}.model{font-size:18px;line-height:1.8}.explain{color:#cbd3e8;line-height:1.8}.score{font-size:34px;font-weight:800}.hidden{display:none}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--muted);font-size:13px}
footer{text-align:center;color:#667087;padding:20px}
@media(max-width:560px){.grades{grid-template-columns:1fr}.panel{padding:17px}.question{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="sigil">⚔️</div>
<h1>厨二語録現代語訳検定</h1>
<p>――汝、その言葉の真意を解読せよ。</p>
</header>

<section id="home" class="panel">
<h2>階級を選択</h2>
<p style="color:var(--muted)">5級から特級まで。数字が小さくなるほど難解になり、特級では解釈そのものが試される。</p>
<p style="color:#8db4ff">※回答を入力すると「自動解読判定」も使用できます。</p>
<div class="grades">
<button class="grade" onclick="start('5級')"><b>5級</b><span>入門・封印された言葉</span></button>
<button class="grade" onclick="start('4級')"><b>4級</b><span>比喩の門</span></button>
<button class="grade" onclick="start('3級')"><b>3級</b><span>心象の読解</span></button>
<button class="grade" onclick="start('2級')"><b>2級</b><span>境界の解読者</span></button>
<button class="grade" onclick="start('1級')"><b>1級</b><span>終焉と再生</span></button>
<button class="grade" onclick="start('特級')"><b>特級</b><span>解読不能領域・全5問</span></button>
</div>
</section>

<section id="quiz" class="panel hidden">
<div><span id="gradeTag" class="tag"></span> <span id="countTag" class="tag"></span></div>
<div class="progress"><div id="bar" class="bar"></div></div>
<h2 id="qtitle"></h2>
<div id="question" class="question"></div>
<textarea id="userAnswer" class="answerbox" placeholder="ここに現代語訳を書け……"></textarea>
<div class="row" style="margin-top:12px">
<button onclick="reveal()">解答を開示する</button>
<button class="secondary" onclick="skip()">解答せず次へ</button>
</div>
<div id="result" class="result hidden"></div>
</section>

<section id="finish" class="panel hidden">
<div style="text-align:center">
<div class="sigil">☠️</div>
<h2>試験終了</h2>
<div id="score" class="score"></div>
<p id="ranktext" style="color:var(--muted)"></p>
<div class="row" style="justify-content:center">
<button onclick="retry()">もう一度挑む</button>
<button class="secondary" onclick="home()">階級選択へ戻る</button>
</div>
</div>
</section>

<footer>厨二語録現代語訳検定 ― The Boundary of Meaning</footer>
</div>
<script>
const DATA = [{"grade": "5級", "num": 1, "question": "その翼を休めよ。今は飛び立つ刻ではない。", "answer": "今は無理をせず休もう。", "explanation": "「翼を休める」は休息、「飛び立つ刻ではない」は今は行動を急ぐ時ではない、という比喩。"}, {"grade": "5級", "num": 2, "question": "闇を恐れる必要はない。夜が明ければ、自然と消え去るものだ。", "answer": "今つらくても、時間が経てば状況は変わる。", "explanation": "「闇」をつらい状況、「夜明け」を状況の好転に置き換えるだけで意味を取れる。"}, {"grade": "5級", "num": 3, "question": "傷ついたならば、無理に笑う必要はない。", "answer": "つらいなら、無理に明るく振る舞わなくていい。", "explanation": "「傷」は心の傷を指す。笑顔を作ることを義務にしなくてよい、という意味。"}, {"grade": "5級", "num": 4, "question": "己の歩みが遅いからといって、道そのものを捨てる必要はない。", "answer": "進むのが遅くても、やりたいことを諦めなくていい。", "explanation": "歩み＝進み方、道＝目標や人生の進路。速度と継続する価値は別だと述べている。"}, {"grade": "5級", "num": 5, "question": "その剣を置け。今のお前に必要なのは戦いではなく、休息だ。", "answer": "今は頑張るより休むことが必要だ。", "explanation": "剣＝努力・戦いの象徴。休息が必要な状態では、さらに頑張ることが解決にならない。"}, {"grade": "5級", "num": 6, "question": "過去という名の鎖に、未来まで繋がれる必要はない。", "answer": "過去に縛られて、これからの可能性まで諦めなくていい。", "explanation": "過去を鎖、未来をその鎖につながれたものとして表現している。"}, {"grade": "5級", "num": 7, "question": "一人で闇を歩く必要はない。隣に灯火を持つ者がいる。", "answer": "一人で抱え込まず、誰かを頼っていい。", "explanation": "闇＝困難、灯火を持つ者＝支えてくれる人。"}, {"grade": "5級", "num": 8, "question": "涙を流すことは、敗北の証ではない。", "answer": "泣くことは負けではない。", "explanation": "涙と敗北を結びつける価値判断を否定している。"}, {"grade": "5級", "num": 9, "question": "迷っているのなら、今すぐ答えを出す必要はない。", "answer": "迷っているなら、急いで決断しなくていい。", "explanation": "ほぼ直接的な言い換え。時間を置くことも選択肢だと示す。"}, {"grade": "5級", "num": 10, "question": "その荷をすべて背負う必要はない。半分はこちらに渡せ。", "answer": "全部一人で抱え込まず、誰かに頼っていい。", "explanation": "荷＝悩みや責任。半分渡す＝負担を分かち合うこと。"}, {"grade": "4級", "num": 1, "question": "雨が降っているのなら、無理に太陽を演じる必要はない。", "answer": "つらい時に無理して明るく振る舞わなくていい。", "explanation": "雨＝つらさ、太陽＝明るい態度。「演じる」が無理をしていることを示す。"}, {"grade": "4級", "num": 2, "question": "折れた剣を握り続けても、戦えるとは限らぬ。時には鍛え直すことも必要だ。", "answer": "傷ついたまま無理を続けず、立て直す時間も必要だ。", "explanation": "折れた剣＝疲弊した自分。鍛え直す＝休養・回復・再準備。"}, {"grade": "4級", "num": 3, "question": "心の扉を閉ざすことは、嵐から身を守る術となる。しかし、鍵を失えば春の風すら入れられなくなる。", "answer": "人を遠ざけることは自分を守れるが、心を閉ざしすぎると良いものまで拒んでしまう。", "explanation": "扉＝心、嵐＝傷つけるもの、春の風＝好意や新しい機会。防御には副作用がある。"}, {"grade": "4級", "num": 4, "question": "己の影を踏み越えようとするな。影は、お前が歩いてきた証なのだから。", "answer": "過去の自分を否定して消そうとせず、自分の過去も受け入れよう。", "explanation": "影は過去や弱さの象徴。歩いてきた証なので、切り捨てる対象ではない。"}, {"grade": "4級", "num": 5, "question": "傷口に鎧を着せても、傷そのものが消えるわけではない。", "answer": "傷ついた心を隠すだけでは、傷そのものは癒えない。", "explanation": "鎧＝防御や強がり。外から見えなくすることと治癒することを区別している。"}, {"grade": "4級", "num": 6, "question": "迷いの森で地図を破る者は、道を失ったのではない。道を探す術を失ったのだ。", "answer": "迷った時に、手掛かりや助けを自分から捨ててはいけない。", "explanation": "地図＝判断材料や支援。道がないのではなく、探すための手段を失ったという逆転。"}, {"grade": "4級", "num": 7, "question": "燃え尽きるまで炎を掲げ続ける必要はない。小さな火種を守ることもまた、戦いだ。", "answer": "限界まで頑張り続けず、続けられる力を守ることも大切だ。", "explanation": "炎＝情熱・努力、火種＝最低限残したい意欲。継続のための休息を肯定している。"}, {"grade": "4級", "num": 8, "question": "昨日の亡霊を追い続ければ、今日の足元にある花を踏み潰すことになる。", "answer": "過去にとらわれすぎると、今ある大切なものを見失う。", "explanation": "亡霊＝過去、花＝現在の小さな幸せや機会。"}, {"grade": "4級", "num": 9, "question": "沈黙は弱さではない。言葉を選ぶために口を閉ざす者もいる。", "answer": "黙っていることが、必ずしも弱い・何も考えていないということではない。", "explanation": "沈黙の理由を一つに決めつけない。考えるための沈黙もある。"}, {"grade": "4級", "num": 10, "question": "己の心を牢獄にするな。誰にも壊されぬよう築いた壁は、時として己自身を閉じ込める。", "answer": "自分を守るための心の壁を作りすぎると、自分自身を苦しめることがある。", "explanation": "壁は防御にも拘束にもなる。安全と孤立の両面を示す比喩。"}, {"grade": "3級", "num": 1, "question": "胸奥に灯した燭火を、誰にも見えぬからといって消してはならない。光とは、誰かに見せるためだけに存在するものではない。", "answer": "誰にも評価されなくても、自分にとって大切なものを守っていい。", "explanation": "燭火＝夢・好きなもの・内面的な価値。価値は他人から見えることだけで決まらない。"}, {"grade": "3級", "num": 2, "question": "剣を振るうことに慣れた者ほど、剣を置くことを恐れる。戦わぬ自分に価値がないと思い始めるからだ。", "answer": "頑張ることに慣れた人ほど、休むことに罪悪感を持つことがある。", "explanation": "努力を自己価値と結びつける心理を「剣を置く恐怖」で表している。"}, {"grade": "3級", "num": 3, "question": "己の心に降り積もった雪を、春が来るまで待つこともまた一つの選択だ。無理に溶かそうとすれば、その下に何が眠っているのか見失う。", "answer": "心の問題を急いで解決しようとせず、時間をかけて向き合うことも大切だ。", "explanation": "雪＝抑え込まれた感情。急いで溶かすと、その感情の中身を丁寧に理解できなくなる。"}, {"grade": "3級", "num": 4, "question": "他者の期待という名の王冠は、頭に載せるにはあまりにも重い。それを脱ぎ捨てた瞬間、初めて己の首がどれほど疲れていたかを知るだろう。", "answer": "周囲の期待に応え続けることに疲れたなら、それを手放して自分の望みを考えていい。", "explanation": "王冠は期待・役割。重さに慣れていると、自分が疲れていることにも気づきにくい。"}, {"grade": "3級", "num": 5, "question": "深淵を覗き込むことを恐れるな。だが、己が深淵そのものになったと錯覚してはならない。", "answer": "自分の暗い感情や苦しさを見つめても、それが自分のすべてだと思わなくていい。", "explanation": "深淵＝苦しさや暗い感情。認識することと同一視することを分けている。"}, {"grade": "3級", "num": 6, "question": "誰かの物語に登場するために、自分の頁を破り捨てる必要はない。", "answer": "誰かに必要とされるために、自分自身の人生や望みを犠牲にしなくていい。", "explanation": "他者の物語＝他人中心の人生、頁＝自分の人生。"}, {"grade": "3級", "num": 7, "question": "心に鍵を掛けたのは、おそらく誰かに壊されたくなかったからだろう。だが、閉じた扉の前で待っている者まで拒む必要はあるのか？", "answer": "傷つかないために人を遠ざけても、信頼できる人まで拒む必要はないのではないか。", "explanation": "防御の理由を理解しつつ、その防御が無差別になっていないか問いかける。"}, {"grade": "3級", "num": 8, "question": "己を許せぬ者は、過去の己を罰し続けることで、現在の己まで傷つけてしまう。", "answer": "過去の自分を責め続けると、今の自分まで苦しめることになる。", "explanation": "過去の自己への罰が現在へ延長される構造を示す。"}, {"grade": "3級", "num": 9, "question": "誰かを救えなかったからといって、その者へ差し出した手まで無意味になるわけではない。", "answer": "相手を完全には助けられなくても、助けようとしたことには意味がある。", "explanation": "結果と行為の価値を分離している。救えなかった＝何もしていない、ではない。"}, {"grade": "3級", "num": 10, "question": "夢を失ったのではない。ただ、夢を叶えられなかった自分を見ることが怖くて、夢そのものを憎むことにしたのではないか？", "answer": "夢を諦めたのではなく、叶えられない自分を見るのが怖くて夢を嫌いになった可能性はないか。", "explanation": "夢への憎しみを自己防衛として読む問い。断定ではなく内省を促している。"}, {"grade": "2級", "num": 1, "question": "己が涙を弱さと呼ぶ者よ。枯れ果てた大地に咲く花だけを強さと呼ぶなら、雨は一体、何のために降る？", "answer": "涙や弱さにも、回復や成長を支える意味があるのではないか。", "explanation": "花だけを成果・強さとし、雨を涙・休息・感情として対置している。"}, {"grade": "2級", "num": 2, "question": "翼を持つ者が、飛ばぬことを選んだからといって、その者の翼が偽物になるわけではない。力とは、行使した量によってのみ証明されるものではないのだから。", "answer": "能力があっても使わない選択をしたからといって、能力の価値がなくなるわけではない。", "explanation": "翼＝能力。能力の存在と、それをどれだけ使うかを区別している。"}, {"grade": "2級", "num": 3, "question": "過去を切り捨てれば自由になれると思うか？ならば、己をここまで運んできた足跡まで消えてしまうぞ。", "answer": "過去を全部否定することが、必ずしも自分を自由にするわけではない。", "explanation": "足跡＝経験。過去には苦痛だけでなく、現在の自分を形成したものも含まれる。"}, {"grade": "2級", "num": 4, "question": "己の心を守るために築いた城壁を、己の心へ続く道まで塞ぐな。敵を締め出すことと、味方を拒むことは同じではない。", "answer": "自分を傷つける人を遠ざけることと、信頼できる人まで拒絶することは別だ。", "explanation": "城壁＝境界線。必要な防御と過剰な閉鎖を区別する。"}, {"grade": "2級", "num": 5, "question": "『大丈夫』という言葉を盾にするのは構わない。だが、盾を下ろせぬほど戦場が長く続いているのなら、それはもう防具ではなく牢獄だ。", "answer": "強がりで自分を守ることも必要だが、強がり続けて本音を出せなくなると自分を苦しめる。", "explanation": "盾＝「大丈夫」という防衛。役立つ防具が、外せなくなると拘束具になる。"}, {"grade": "2級", "num": 6, "question": "誰かの痛みを知らぬから救えぬ、と決めつけるな。同じ傷を持たぬ者だからこそ、傷口に触れず隣に立つことができる場合もある。", "answer": "同じ経験をしていなくても、相手を支えられる。違う経験だからこそできる支え方もある。", "explanation": "共感＝同一経験だけではない。相手の傷を勝手に触らず、隣にいるという支援を示す。"}, {"grade": "2級", "num": 7, "question": "己の中にある混沌を、秩序という名の箱へ押し込め続けるな。箱が壊れるのではない。いつか、お前自身が箱の形にしか生きられなくなる。", "answer": "感情を無理に整理・抑圧し続けると、自分の自然な感情や個性まで失う危険がある。", "explanation": "箱＝固定された自己像やルール。混沌＝整理しきれない感情。"}, {"grade": "2級", "num": 8, "question": "光の中でしか己を認められぬ者は、夜が来るたびに己を失う。闇の中にいる自分もまた、自分であると知る者だけが、夜明けを待てる。", "answer": "調子が良い時だけ自分を認めるのではなく、苦しい時の自分も自分だと認める必要がある。", "explanation": "光と闇を好調・不調として読む。自己価値を状態に依存させないという話。"}, {"grade": "2級", "num": 9, "question": "手放すことと、諦めることを同じにするな。指を開くのは、失うためだけではない。新たなものを掴むためにも、手は空けておかねばならぬ。", "answer": "何かを手放すことは、必ずしも敗北や諦めではない。新しい可能性のために手放すこともある。", "explanation": "手放す行為の目的を一つに固定しない。執着を解くことを肯定する。"}, {"grade": "2級", "num": 10, "question": "己を変えなければ愛されぬと思うなら、変わった後に愛されたのは、本当に『己』なのか？それとも、己が作り上げた仮面なのか？", "answer": "愛されるために自分を作り変えすぎると、本当の自分が愛されているのか分からなくなる。", "explanation": "自己変容そのものを否定せず、「誰のために変えたのか」「何を失ったのか」を問う。"}, {"grade": "1級", "num": 1, "question": "領域展開が滞っているようだな。時には羽根を畳むことも必要であろう。しかし混沌に自由を与えては、己が境界すら無に帰してしまうぞ。", "answer": "手を止めて休むことも必要だが、心の中のモヤモヤを無理に押し込め続けると、自分の感情や表現まで分からなくなる。", "explanation": "領域展開＝創作・思考・表現。羽根を畳む＝休息。混沌＝未整理の感情。休むことと感情を抑圧することを区別している。"}, {"grade": "1級", "num": 2, "question": "深淵より這い上がった者よ、二度と落ちぬことだけを願うな。足元を見ることを恐れて空だけを仰げば、次に訪れる闇の深さすら測れなくなる。", "answer": "再び苦しまないことだけを目指して現実を見ないのではなく、過去の苦しさや現在の足元も見ながら進む必要がある。", "explanation": "深淵＝過去の苦境、空＝理想だけを見ること。再発への恐れが現実認識を奪う危険を示す。"}, {"grade": "1級", "num": 3, "question": "己を救えなかった過去の自分を、今の自分が裁くな。あの日の己には、今日のお前が持つ刃も、地図も、夜明けの知識もなかったのだから。", "answer": "今の知識や経験を持って、当時の自分を責めすぎてはいけない。", "explanation": "現在の能力を過去へ逆輸入してはいけないという趣旨。過去の自分には当時の情報と手段しかなかった。"}, {"grade": "1級", "num": 4, "question": "世界に適応するため己を削り続けた者は、やがて『生きやすくなった』のではなく、『自分が何であったか分からなくなった』ことに気づく。その時、失ったものを数えることすらできぬほど、削りすぎてはならない。", "answer": "周囲に合わせるため自分を変え続けると、適応できても自分らしさや望みを見失うことがある。", "explanation": "適応自体を否定せず、自己喪失との境界を問題にしている。"}, {"grade": "1級", "num": 5, "question": "救済を求める者の手を取ることと、その者の人生を己の腕で背負うことは同義ではない。すべてを背負おうとする者は、いつしか救う相手と共に沈むことになる。", "answer": "人を支えることと、その人の問題を全部自分の責任として背負うことは違う。", "explanation": "支援と過剰な責任負担を区別する。自分まで倒れれば、支えること自体が続けられなくなる。"}, {"grade": "1級", "num": 6, "question": "己の心に生じた醜き感情を、存在してはならぬものとして葬るな。感情とは命令ではない。憎しみを抱いたからといって憎しみのままに振る舞う必要はなく、嫉妬したからといって誰かを傷つける必要もない。闇を認めることと、闇に従うことは違うのだ。", "answer": "嫌な感情が湧くこと自体を否定せず、感情と行動を分けて考えるべきだ。", "explanation": "感情は自動的に生じるが、行動は選択できるという区別。「認める」と「従う」を分けている。"}, {"grade": "1級", "num": 7, "question": "もし己の価値を、誰かに必要とされることだけで測るなら、その者が去った瞬間、お前の価値まで共に消えることになる。他者の手に、己の存在証明を預けるな。", "answer": "誰かに必要とされることだけを自分の価値の根拠にすると、その関係がなくなった時に自分の価値まで失ったように感じてしまう。", "explanation": "他者からの承認を価値の唯一の基準にしない、という意味。"}, {"grade": "1級", "num": 8, "question": "夢を諦めた者が、夢を語る者を笑うことがある。それは夢が愚かだからではない。かつて己が願ったものを、もう願えぬ自分に気づかされるからだ。だからこそ、他者の翼を折ることで己の墜落を正当化してはならない。", "answer": "他人の夢を否定したくなった時、それが夢への批判ではなく、自分の諦めへの苦しさから来ていないか考えるべきだ。", "explanation": "他者への攻撃を自己防衛として解釈する。ただし、これは一般的可能性として述べており、全ての批判の原因を断定してはいない。"}, {"grade": "1級", "num": 9, "question": "『もう遅い』という言葉は、時計が告げるものではない。己が過去を見つめるあまり、未来に残された時間まで過去の続きだと思い込んだ者が、自ら刻む終焉の鐘だ。だから、鐘が鳴ったから終わりなのではない。終わりだと決めた時に、初めて鐘は鳴る。", "answer": "過去の失敗から、これからも何も変わらないと決めつけることで、自分から可能性を閉ざしてしまうことがある。", "explanation": "「遅い」を客観的な時刻ではなく、自分が未来を閉ざす判断として描く。ただし現実の期限まで否定する話ではない。"}, {"grade": "1級", "num": 10, "question": "己の中にあるものを、すべて言葉にできると思うな。名を持たぬ感情が存在してはならぬ理由など、どこにもない。言葉にならぬものを無理に言葉へ鋳造すれば、伝えるための器が、いつしか感情そのものを削り始める。ならば時には、語らぬこともまた表現なのだ。沈黙とは空白ではない。言葉になれなかったものが、そこに在るという証明なのだから。", "answer": "すべての感情を無理に言語化する必要はなく、言葉にならない感情や沈黙にも意味がある。", "explanation": "言語化は有効な手段だが万能ではない。無理に言葉へ押し込むことで、元の感情を単純化してしまう可能性を示している。"}, {"grade": "特級", "num": 1, "question": "鏡を砕けば、醜き己は消えると思うか。砕けた硝子の一片一片に映る己を見て、なお同じ問いを繰り返すことになるぞ。", "answer": "自分の嫌いな部分を外側から消そうとしても、自己否定そのものが解決しなければ苦しさは残る。", "explanation": "鏡＝自己像、砕く＝自己像を否定する行為。外見や環境を変えることだけでは、自己評価の問題そのものは必ずしも消えないという読みができる。"}, {"grade": "特級", "num": 2, "question": "己の心より生まれた怪物を殺した者よ。祝福を求めるな。その怪物が、お前をここまで生かした理由まで否定することになる。されど、飼い慣らせとも言わぬ。牙を持つものは、牙を持ったまま己の檻を出る術を探せ。", "answer": "自分の中の醜い感情や防衛反応にも、それが生まれた理由がある。否定し尽くす必要も、感情のまま従う必要もなく、抱えたまま扱い方を探せばいい。", "explanation": "怪物＝怒り・嫉妬・自己防衛など。生まれた理由を理解することと、その感情に支配されることを分けている。"}, {"grade": "特級", "num": 3, "question": "『理解されたい』と願いながら、誰にも届かぬ言葉を選ぶ者がいる。それは矛盾ではない。ただ、届いてしまえば壊れるものを、届かぬ言葉の奥へ隠しているだけだ。ならばその沈黙を暴くことが、救いだと言い切れるか？", "answer": "理解されたい気持ちと、傷つかないために理解されたくない気持ちは同時に存在し得る。相手の沈黙を無理に暴くことが、必ずしも助けになるとは限らない。", "explanation": "「届かない言葉」は本音を隠す表現とも、本人だけの表現とも読める。救う側が一方的に言語化してしまう危険を問う。"}, {"grade": "特級", "num": 4, "question": "夜明けを待つ者よ。夜を終わらせることばかり願うな。お前が夜と呼んだものの中には、昼の光では見ることのできなかった星もあったはずだ。闇を失えば、星まで失う。されど、星を見るために夜へ留まり続ける理由にもならぬ。――では、お前はいつ、歩き出す？", "answer": "苦しい時期にも、その中で得たものや見えたものはある。しかし苦しみを美化してそこに留まり続ける必要もない。自分にとって進む時期を考える必要がある。", "explanation": "夜＝苦境、星＝苦境の中で得た理解や経験。苦しみを否定もしなければ神聖化もしない、という二重構造。"}, {"grade": "特級", "num": 5, "question": "己を愛せぬ者に『己を愛せ』と告げるのは、凍てついた湖へ『泳げ』と命じるようなものだ。ならばまず、氷を溶かせばよいのか。火を焚けばよいのか。それとも、春が来るまで岸に座っているべきなのか。……否。その問いそのものが、すでに間違っている。湖に必要なのは、泳げるようになることだけなのか？", "answer": "「自分を好きになる」を唯一の到達目標にせず、その人が今必要としているものを考えるべきだ。自分を愛せない状態でも生きたり、支えを得たり、少し楽になったりする道はある。", "explanation": "湖＝その人の心身の状態、泳ぐ＝自己愛。氷を溶かす方法だけを考えるのではなく、「泳げるようになることが本当に唯一の目的なのか」と目標そのものを問い直している。"}];
let grade="", qs=[], idx=0, score=0, revealed=false;
function start(g){grade=g;qs=DATA.filter(x=>x.grade===g);idx=0;score=0;revealed=false;document.getElementById('home').classList.add('hidden');document.getElementById('finish').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');show();}
function show(){let x=qs[idx];document.getElementById('gradeTag').textContent=grade;document.getElementById('countTag').textContent=`${idx+1} / ${qs.length}`;document.getElementById('qtitle').textContent=`第${idx+1}問`;document.getElementById('question').textContent=x.question;document.getElementById('userAnswer').value="";document.getElementById('result').classList.add('hidden');document.getElementById('result').innerHTML="";revealed=false;document.getElementById('bar').style.width=((idx)/qs.length*100)+"%";}
function reveal(){if(revealed)return;let x=qs[idx];let val=document.getElementById('userAnswer').value.trim();document.getElementById('result').innerHTML=`<h3>◆ 模範解答</h3><div class="model">${escapeHtml(x.answer)}</div><h3>◆ 解説</h3><div class="explain">${escapeHtml(x.explanation)}</div><hr style="border:0;border-top:1px solid #252d40;margin:16px 0"><p>自分の訳が意味として近ければ正解扱いにしてよい。特級は特に「模範解答と完全一致する必要はない」。</p><div class="row">
<button onclick="autoJudge()">⚔️ 自動解読判定</button>
<button class="secondary" onclick="mark(true)">✓ 自分で正解</button>
<button class="danger" onclick="mark(false)">× 自分で不正解</button>
</div>
<div id="judge" style="margin-top:12px"></div>`;document.getElementById('result').classList.remove('hidden');revealed=true;}
function mark(ok){if(ok)score++;next();}
function skip(){if(!revealed){reveal();return}}
function next(){idx++;if(idx>=qs.length)finish();else show();}
function autoJudge(){
  if(!revealed)return;
  const input=document.getElementById('userAnswer').value.trim();
  if(!input){document.getElementById('judge').innerHTML='<p style="color:#ffb7c8">回答が空だ。まず汝自身の解釈を記せ。</p>';return;}
  const x=qs[idx];
  const a=normalize(input), b=normalize(x.answer);
  const stop=new Set(["する","こと","もの","ため","必要","自分","相手","意味","よう","ある","いる","なる","では","ない","なく","そして","それ","その","これ","ただ","とも","から","まで","ように"]);
  const words=[...new Set((b.match(/[一-龥ぁ-んァ-ヶー]{2,}/g)||[]).filter(w=>!stop.has(w)))];
  let hits=0; for(const w of words){if(a.includes(w))hits++;}
  const ratio=words.length?hits/words.length:0;
  let verdict, ok;
  if(ratio>=0.55){verdict="解読成功";ok=true;}
  else if(ratio>=0.30){verdict="部分解読";ok=false;}
  else {verdict="解読失敗";ok=false;}
  document.getElementById('judge').innerHTML=`<div class="result"><b>自動判定：${verdict}</b><p>模範解答との意味語一致率：${Math.round(ratio*100)}%</p><p style="color:#aab2c7">※これは文章の意味を完全に理解するAI採点ではなく、模範解答の主要語との一致を使った簡易判定。特級では自動判定より自分の解釈を優先せよ。</p><button onclick="mark(${ok})">${ok?"この判定で次へ":"不正解として次へ"}</button></div>`;
}
function normalize(t){return t.replace(/[\s。、！？「」『』（）()・,，.]/g,"").replace(/です|ます|だろう|でしょう|という|ような/g,"");}
function finish(){
  document.getElementById('quiz').classList.add('hidden');document.getElementById('finish').classList.remove('hidden');
  document.getElementById('score').textContent=`${score} / ${qs.length}`;
  let pct=score/qs.length;
  let title, t;
  if(pct===1){title="【境界の超越者】";t="完全解読――汝、言葉の深淵を踏破した。";}
  else if(pct>=.9){title="【終焉を識る者】";t="ほぼ完全な解読。仮面の奥まで視えている。";}
  else if(pct>=.8){title="【深淵の解読者】";t="高度解読――言葉の裏側まで届いている。";}
  else if(pct>=.7){title="【境界の観測者】";t="多くの意味を捉えた。さらなる深度へ進め。";}
  else if(pct>=.6){title="【言霊の探索者】";t="解読成功――まだ深淵は残されている。";}
  else if(pct>=.4){title="【仮面の剥離者】";t="一部の真意を見抜いた。";}
  else {title="【迷える異邦人】";t="言葉はまだ仮面を被っている。再び挑め。";}
  document.getElementById('ranktext').innerHTML=`<strong style="font-size:25px">${title}</strong><br>${t}`;
}
function retry(){start(grade)} function home(){document.getElementById('finish').classList.add('hidden');document.getElementById('quiz').classList.add('hidden');document.getElementById('home').classList.remove('hidden')}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c])).replace(/\n/g,"<br>")}
</script>
</body></html>
